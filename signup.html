<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Sign Up · PatioNest — Outdoor Living</title>

    <!-- Favicon — patio umbrella with chairs, brand terracotta -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
    <link rel="shortcut icon" href="assets/favicon.svg"/>

    <!-- Tailwind CSS -->
     <script src="tailwind.js"></script>


    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        terracotta: '#C4724B',
                        olive: '#5B8C5A',
                        cream: '#FBF3EB',
                        stone: '#D9C5B2',
                        dusk: '#A65A3A',
                        sage: '#9BB87F',
                        sand: '#EADCCB',
                    },
                    fontFamily: {
                        'display': ['"Poppins"', 'system-ui', 'sans-serif'],
                        'body': ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                    backgroundImage: {
                        'warm-pattern': 'radial-gradient(circle at 30% 40%, rgba(196, 114, 75, 0.08) 0%, transparent 70%)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spinSlow 10s linear infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
                        spinSlow: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* ----- NO SCROLL — fit exactly one screen ----- */
        html,
        body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #FBF3EB;
            color: #2E1F1A;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0;
        }

        .dark body {
            background-color: #2E1F1A;
            color: #FBF3EB;
        }

        /* Dark mode fallback text contrast overrides */
        .dark .text-\[\#2E1F1A\] {
            color: #FBF3EB;
        }
        .dark .text-dusk {
            color: #9CA3AF;
        }
        .dark input,
        .dark select,
        .dark textarea {
            color: #FFFFFF !important;
        }

        /* toggle buttons — positioned top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(196, 114, 75, 0.2);
            color: #C4724B;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .dark .toggle-btn {
            background: rgba(196, 114, 75, 0.2);
            color: #C4724B;
        }

        .toggle-btn:hover {
            transform: scale(1.1);
            background: #C4724B;
            color: #FBF3EB;
        }

        .dark .toggle-btn:hover {
            background: #C4724B;
            color: #FBF3EB;
        }

        /* SIGNUP CARD — PatioNest theme */
        .signup-card {
            background: white;
            border-radius: 36px;
            padding: 1.8rem 2rem;
            box-shadow: 0 20px 45px rgba(196, 114, 75, 0.12);
            border: 1px solid rgba(196, 114, 75, 0.2);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            transition: background 0.2s ease;
        }

        .dark .signup-card {
            background: #3D2C25;
            border-color: rgba(196, 114, 75, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* input styling */
        .signup-input {
            width: 100%;
            padding: 0.8rem 1.2rem 0.8rem 3rem;
            border-radius: 50px;
            border: 1px solid #E8E4D8;
            background: white;
            font-size: 0.9rem;
            transition: all 0.2s;
            color: #2E1F1A;
        }

        .dark .signup-input {
            background: #2E1F1A;
            border-color: #4A485C;
            color: #FBF3EB;
        }

        .signup-input:focus {
            outline: none;
            border-color: #C4724B;
            box-shadow: 0 0 0 3px rgba(196, 114, 75, 0.2);
        }

        .dark .signup-input:focus {
            border-color: #C4724B;
            box-shadow: 0 0 0 3px rgba(196, 114, 75, 0.25);
        }

        /* password wrapper for eye icon */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .signup-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #C4724B;
            font-size: 0.95rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password {
            color: #C4724B;
        }

        .toggle-password:hover {
            color: #A65A3A;
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .signup-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* primary button */
        .scoop-btn {
            background: #C4724B;
            color: #FBF3EB;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
        }

        .scoop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(196, 114, 75, 0.35);
            background: #A65A3A;
        }

        /* social login buttons */
        .social-btn-row {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            width: 100%;
            margin-top: 0.25rem;
        }

        .social-btn {
            flex: 1;
            padding: 0.7rem 0.5rem;
            border-radius: 50px;
            border: 1px solid #E8E4D8;
            background: white;
            color: #2E1F1A;
            font-weight: 500;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            cursor: pointer;
        }

        .dark .social-btn {
            background: #2E1F1A;
            border-color: #4A485C;
            color: #FBF3EB;
        }

        .social-btn:hover {
            background: #FBF3EB;
            border-color: #C4724B;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .dark .social-btn:hover {
            background: #4A485C;
            border-color: #C4724B;
        }

        .social-btn i {
            font-size: 1.1rem;
            color: #C4724B;
        }

        /* RTL adjustments */
        [dir="rtl"] .signup-input {
            padding: 0.8rem 3rem 0.8rem 1.2rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        [dir="rtl"] .fa-arrow-right {
            transform: scaleX(-1);
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 20px;
        }

        [dir="rtl"] .flex.space-x-2> :not([hidden])~ :not([hidden]) {
            margin-right: 0.5rem;
            margin-left: 0;
        }

        /* hidden utility */
        .hidden {
            display: none;
        }

        /* container */
        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        /* center logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
        }

        .brand-logo {
            background: #C4724B;
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0;
            box-shadow: 0 4px 10px rgba(196, 114, 75, 0.2);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .brand-logo {
                width: 40px;
                height: 40px;
            }
        }

        .brand-logo svg {
            width: 100%;
            height: 100%;
            padding: 6px;
        }

        /* welcome title styles */
        .welcome-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #2E1F1A;
            margin-top: 1.75rem;
            margin-bottom: 0.1rem;
            text-align: center;
            line-height: 1.2;
        }

        .dark .welcome-title {
            color: #FBF3EB;
        }

        .welcome-subtitle {
            font-size: 0.85rem;
            color: #6D6875;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .dark .welcome-subtitle {
            color: #B8B5C5;

        /* terms text style */

            color: #6D6875;
        }

        .dark .terms-text {
            color: #9CA3AF;
        }

        .terms-link {
            color: #C4724B;
            font-weight: 500;
            text-decoration: none;
        }

        .terms-link:hover {
            text-decoration: underline;
            color: #A65A3A;
        }

        /* divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.2rem 0 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E8E4D8;
        }

        .dark .divider::before,
        .dark .divider::after {
            border-bottom-color: #4A485C;
        }

        .divider span {
            font-size: 0.7rem;
            padding: 0 0.8rem;
            color: #6D6875;
            font-weight: 500;
        }

        .dark .divider span {
            color: #9CA3AF;
        }

        /* Fix for short screens */
        @media (max-height: 650px) {
            .signup-card {
                padding: 0.75rem 1.5rem;
                transform: scale(0.95);
                transform-origin: center;
            }

            .logo-center {
                margin-bottom: 0.5rem;
            }

            .welcome-title {
                font-size: 1.2rem;
                margin-top: 0;
            }

            .welcome-subtitle {
                font-size: 0.75rem;
                margin-bottom: 0.25rem;
            }

            .signup-input {
                padding: 0.5rem 0.8rem 0.5rem 2.5rem;
                font-size: 0.8rem;
            }

            .scoop-btn {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
                margin-top: 0.25rem;
            }

            .divider {
                margin: 0.4rem 0;
            }

            .social-btn {
                padding: 0.4rem 0.5rem;
                font-size: 0.75rem;
            }

            .theme-toggle-wrapper {
                top: 8px;
                right: 8px;
            }

            .toggle-btn {
                width: 32px;
                height: 32px;
                font-size: 0.8rem;
            }
        }

        /* spacing adjustments */
        .space-y-4> :not([hidden])~ :not([hidden]) {
            margin-top: 0.85rem;
        }

        /* mobile friendly */
        @media (max-width: 380px) {
            .signup-card {
                padding: 1rem 1.2rem;
                border-radius: 24px;
            }

            .welcome-title {
                font-size: 1.2rem;
                margin-top: 0.25rem;
            }

            .welcome-subtitle {
                font-size: 0.75rem;
                margin-bottom: 0.25rem;
            }

            .logo-center {
                margin-bottom: 0.5rem;
            }

            .brand-logo {
                width: 32px;
                height: 32px;
                margin-bottom: 0.25rem;
            }

            .social-btn-row {
                gap: 0.5rem;
                margin-top: 0.1rem;
            }

            .social-btn {
                padding: 0.4rem 0.3rem;
                font-size: 0.75rem;
                gap: 0.3rem;
            }

            .social-btn i {
                font-size: 0.9rem;
            }

            .signup-input {
                padding: 0.6rem 0.8rem 0.6rem 2.6rem;
                font-size: 0.8rem;
            }

            .toggle-password {
                right: 0.8rem;
            }

            .scoop-btn {
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }

            .divider {
                margin: 0.8rem 0 0.5rem;
            }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper {
                top: 12px;
                right: 12px;
            }

            [dir="rtl"] .theme-toggle-wrapper {
                left: 12px;
            }
        }
    </style>
</head>

<body class="bg-cream dark:bg-[#2E1F1A] warm-pattern">

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->

    <!-- ===== SIGNUP CARD ===== -->
    <div class="container-tight">

            <div class="logo-center mb-6">

                            <ellipse cx="7" cy="14" rx="2.5" ry="1.6" transform="rotate(-30 7 14)" fill="white" opacity="0.6"/>

                            <ellipse cx="29" cy="14" rx="2.5" ry="1.6" transform="rotate(30 29 14)" fill="white" opacity="0.6"/>

                <h1 class="welcome-title">Join the Outdoors</h1>

        </div>
    </div>

    <!-- ===== DARK / LIGHT + RTL TOGGLE SCRIPT + EYE ICON FUNCTIONALITY ===== -->
    <script>
        (function() {
            // ---------- THEME ----------
            const themeToggle = document.getElementById('theme-toggle');

            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }

                const icon = themeToggle?.querySelector('i');
                if (icon) {
                    icon.classList.remove('fa-sun', 'fa-moon');
                    icon.classList.add(isDark ? 'fa-moon' : 'fa-sun');
                }

                if (isDark) {
                    themeToggle?.classList.add('active');
                    localStorage.setItem('theme', 'dark');
                } else {
                    themeToggle?.classList.remove('active');
                    localStorage.setItem('theme', 'light');
                }
            }

            // Check for saved theme or system preference
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                setTheme(true);
            } else if (savedTheme === 'light') {
                setTheme(false);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme(true);
            } else {
                setTheme(false);
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            // ---------- RTL ----------
            const rtlBtn = document.getElementById('rtl-toggle');

            function setRTL(isRTL) {
                if (isRTL) {
                    document.documentElement.dir = 'rtl';
                    document.documentElement.lang = 'ar';
                    rtlBtn?.classList.add('active');
                    localStorage.setItem('dir', 'rtl');
                } else {
                    document.documentElement.dir = 'ltr';
                    document.documentElement.lang = 'en';
                    rtlBtn?.classList.remove('active');
                    localStorage.setItem('dir', 'ltr');
                }
            }
            const savedDir = localStorage.getItem('dir');
            savedDir === 'rtl' ? setRTL(true) : setRTL(false);

            if (rtlBtn) {
                rtlBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    setRTL(document.documentElement.dir !== 'rtl');
                });
            }

            // ---------- EYE ICON TOGGLE PASSWORD VISIBILITY ----------
            const toggleButtons = document.querySelectorAll('.toggle-password');
            toggleButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const passwordInput = document.getElementById(targetId);
                    if (passwordInput) {
                        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                        passwordInput.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            if (type === 'text') {
                                icon.classList.remove('fa-eye-slash');
                                icon.classList.add('fa-eye');
                            } else {
                                icon.classList.remove('fa-eye');
                                icon.classList.add('fa-eye-slash');
                            }
                        }
                    }
                });
            });

            // ---------- SOCIAL BUTTONS (Google & Apple) interactive demo ----------
            const googleBtn = document.getElementById('googleSignupBtn');
            const appleBtn = document.getElementById('appleSignupBtn');

            if (googleBtn) {
                googleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('🌿 Google sign-up would be implemented here.\n\n✨ Welcome to the PatioNest community!');
                });
            }
            if (appleBtn) {
                appleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('🌿 Apple sign-up would be implemented here.\n\n✨ Welcome to the PatioNest community!');
                });
            }

            // ---------- TERMS & PRIVACY LINKS ----------
            const termsLink = document.getElementById('termsLink');
            const privacyLink = document.getElementById('privacyLink');

            if (termsLink) {
                termsLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('📜 Terms of Service would open here.');
                });
            }
            if (privacyLink) {
                privacyLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('📜 Privacy Policy would open here.');
                });
            }

            // ---------- PASSWORD MATCH + FORM SUBMIT ----------
            const signupForm = document.getElementById('signupForm');

            if (signupForm) {
                signupForm.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const password = document.getElementById('signup-password')?.value;
                    const confirm = document.getElementById('signup-confirm-password')?.value;
                    const termsCheck = document.getElementById('terms');
                    const fullName = document.getElementById('fullName')?.value;
                    const email = document.getElementById('email')?.value;

                    if (!fullName || !email) {
                        alert('🌿 Please enter your name and email address to join the PatioNest community!');
                        return false;
                    }

                    if (password !== confirm) {
                        alert('⚠️ Passwords do not match. Please re-enter your password.');
                        return false;
                    }

                    if (password && password.length < 6) {
                        alert('🔐 Password must be at least 6 characters long.');
                        return false;
                    }

                    if (!termsCheck.checked) {
                        alert('📜 Please accept the Terms of Service and Privacy Policy to continue.');
                        return false;
                    }

                    // Direct redirect to login.html
                    window.location.href = 'login.html';

                    return true;
                });
            }
        })();
    </script>
</body>
</html>
