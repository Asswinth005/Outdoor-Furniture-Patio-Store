<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Sign In · PatioNest — Outdoor Living</title>

    <!-- Favicon — patio umbrella with chairs, brand terracotta -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
    <link rel="shortcut icon" href="assets/favicon.svg"/>

    <!-- Tailwind CSS -->
     <script src="tailwind.js"></script>


    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        terracotta: '#C4724B',
                        olive: '#5B8C5A',
                        cream: '#FBF3EB',
                        stone: '#D9C5B2',
                        dusk: '#A65A3A',
                        sage: '#9BB87F',
                        sand: '#EADCCB',
                    },
                    fontFamily: {
                        'display': ['"Poppins"', 'system-ui', 'sans-serif'],
                        'body': ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                    backgroundImage: {
                        'warm-pattern': 'radial-gradient(circle at 30% 40%, rgba(196, 114, 75, 0.08) 0%, transparent 70%)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spinSlow 10s linear infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
                        spinSlow: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* ----- NO SCROLL — fit exactly one screen ----- */
        html,
        body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #FBF3EB;
            color: #2E1F1A;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .dark body {
            background-color: #2E1F1A;
            color: #FBF3EB;
        }

        /* Dark mode fallback text contrast overrides */
        .dark .text-\[\#2E1F1A\] {
            color: #FBF3EB;
        }
        .dark .text-dusk {
            color: #9CA3AF;
        }
        .dark input,
        .dark select,
        .dark textarea {
            color: #FFFFFF !important;
        }

        /* toggle buttons — positioned top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(196, 114, 75, 0.2);
            color: #C4724B;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .dark .toggle-btn {
            background: rgba(196, 114, 75, 0.2);
            color: #C4724B;
        }

        .toggle-btn:hover {
            transform: scale(1.1);
            background: #C4724B;
            color: #FBF3EB;
        }

        .dark .toggle-btn:hover {
            background: #C4724B;
            color: #FBF3EB;
        }

        /* LOGIN CARD */
        .login-card {
            background: white;
            border-radius: 36px;
            padding: 2.2rem 2rem 2rem;
            box-shadow: 0 20px 45px rgba(196, 114, 75, 0.12);
            border: 1px solid rgba(196, 114, 75, 0.2);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .dark .login-card {
            background: #3D2C25;
            border-color: rgba(196, 114, 75, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* input styling */
        .login-input {
            width: 100%;
            padding: 0.85rem 1.2rem 0.85rem 3rem;
            border-radius: 50px;
            border: 1px solid #E8E4D8;
            background: white;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: #2E1F1A;
        }

        .dark .login-input {
            background: #2E1F1A;
            border-color: #4A485C;
            color: #FBF3EB;
        }

        .login-input:focus {
            outline: none;
            border-color: #C4724B;
            box-shadow: 0 0 0 3px rgba(196, 114, 75, 0.2);
        }

        .dark .login-input:focus {
            border-color: #C4724B;
            box-shadow: 0 0 0 3px rgba(196, 114, 75, 0.25);
        }

        /* password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .login-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #C4724B;
            font-size: 1rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password {
            color: #C4724B;
        }

        .toggle-password:hover {
            color: #A65A3A;
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .login-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* primary button */
        .scoop-btn {
            background: #C4724B;
            color: #FBF3EB;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 1rem;
            border: none;
            cursor: pointer;
        }

        .scoop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(196, 114, 75, 0.35);
            background: #A65A3A;
        }

        /* social login buttons */
        .social-btn-row {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        .social-btn {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 50px;
            border: 1px solid #E8E4D8;
            background: white;
            color: #2E1F1A;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .dark .social-btn {
            background: #2E1F1A;
            border-color: #4A485C;
            color: #FBF3EB;
        }

        .social-btn:hover {
            background: #FBF3EB;
            border-color: #C4724B;
            transform: translateY(-2px);
        }

        .dark .social-btn:hover {
            background: #4A485C;
            border-color: #C4724B;
        }

        .social-btn i {
            font-size: 1.1rem;
            color: #C4724B;
        }

        /* logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .brand-logo {
            background: #C4724B;
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0;
            box-shadow: 0 4px 10px rgba(196, 114, 75, 0.2);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .brand-logo {
                width: 40px;
                height: 40px;
            }
        }

        .welcome-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2E1F1A;
            margin-top: 1.75rem;
            margin-bottom: 0.25rem;
            text-align: center;
            line-height: 1.2;
        }

        .dark .welcome-title {
            color: #FFFFFF;
        }

        .welcome-subtitle {
            font-size: 0.9rem;
            color: #2E1F1A;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .dark .welcome-subtitle {
            color: #FBF3EB;
        }

        /* RTL adjustments */
        [dir="rtl"] .login-input {
            padding: 0.85rem 3rem 0.85rem 1.2rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        [dir="rtl"] .fa-arrow-right {
            transform: scaleX(-1);
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 20px;
        }

        /* Fix for short screens like Nest Hub (1024x600) */
        @media (max-height: 650px) {
            .login-card {
                padding: 0.8rem 1.5rem;
                transform: scale(0.95);
                transform-origin: center;
            }

            .logo-center {
                margin-bottom: 0.5rem;
            }

            .welcome-title {
                font-size: 1.3rem;
                margin-top: 0;
            }

            .welcome-subtitle {
                font-size: 0.8rem;
                margin-bottom: 0.5rem;
            }

            .login-input {
                padding: 0.6rem 0.8rem 0.6rem 2.5rem;
                font-size: 0.85rem;
            }

            .scoop-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
                margin-top: 0.25rem;
            }

            .theme-toggle-wrapper {
                top: 8px;
                right: 8px;
            }

            .toggle-btn {
                width: 32px;
                height: 32px;
                font-size: 0.8rem;
            }
        }

        /* responsive */
        @media (max-width: 380px) {
            .login-card {
                padding: 1.5rem 1.2rem;
                border-radius: 24px;
            }

            .logo-center {
                margin-bottom: 1rem;
            }

            .welcome-title {
                font-size: 1.3rem;
            }

            .login-input {
                padding: 0.7rem 1rem 0.7rem 2.8rem;
                font-size: 0.85rem;
            }

            .scoop-btn {
                padding: 0.7rem 1.5rem;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper {
                top: 12px;
                right: 12px;
            }

            [dir="rtl"] .theme-toggle-wrapper {
                left: 12px;
            }
        }

        .hidden {
            display: none;
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        .text-terracotta {
            color: #C4724B;
        }

        .hover\:text-terracotta-dark:hover {
            color: #A65A3A;
        }

        a {
            transition: all 0.2s ease;
        }

        /* PatioNest logo SVG inside brand-logo */
        .brand-logo svg {
            width: 100%;
            height: 100%;
            padding: 6px;
        }
    </style>
</head>

<body class="bg-cream dark:bg-[#2E1F1A] warm-pattern">

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:inline"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            ⇄
        </button>
    </div>

    <!-- ===== LOGIN CARD ===== -->
    <div class="container-tight">
        <div class="login-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center mb-8">
                <a href="index.html" class="flex items-center gap-2 md:gap-3 group shrink-0">
                    <div class="brand-logo group-hover:scale-105 transition duration-300">
                        <!-- PatioNest custom logo: chair + leaf vine -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
                            <rect x="8" y="19" width="20" height="5" rx="2.5" fill="white" opacity="0.95"/>
                            <rect x="10" y="11" width="16" height="9" rx="2" fill="white" opacity="0.85"/>
                            <rect x="9" y="24" width="3" height="7" rx="1.5" fill="white" opacity="0.9"/>
                            <rect x="24" y="24" width="3" height="7" rx="1.5" fill="white" opacity="0.9"/>
                            <path d="M6 28 Q4 22 7 17 Q9 13 8 9" stroke="white" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
                            <ellipse cx="7" cy="14" rx="2.5" ry="1.6" transform="rotate(-30 7 14)" fill="white" opacity="0.6"/>
                            <ellipse cx="5.5" cy="20" rx="2.2" ry="1.4" transform="rotate(20 5.5 20)" fill="white" opacity="0.55"/>
                            <path d="M30 28 Q32 22 29 17 Q27 13 28 9" stroke="white" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
                            <ellipse cx="29" cy="14" rx="2.5" ry="1.6" transform="rotate(30 29 14)" fill="white" opacity="0.6"/>
                            <ellipse cx="30.5" cy="20" rx="2.2" ry="1.4" transform="rotate(-20 30.5 20)" fill="white" opacity="0.55"/>
                        </svg>
                    </div>
                    <div>
                        <span class="text-xl md:text-2xl font-display font-bold tracking-tight text-[#2E1F1A] dark:text-cream">
                            Patio<span class="text-terracotta">Nest</span>
                        </span>
                    </div>
                </a>

                <h1 class="welcome-title">Welcome Back</h1>
                <p class="welcome-subtitle">Sign in to explore our outdoor collections &amp; save your favorites</p>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" class="space-y-5" action="#" method="GET">

                <!-- email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-terracotta input-icon">
                        <i class="fas fa-envelope w-5 text-sm"></i>
                    </span>
                    <input type="email" name="email" id="login-email" placeholder="Email address" required
                        class="login-input text-sm md:text-base">
                </div>

                <!-- password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-terracotta input-icon">
                        <i class="fas fa-lock w-5 text-sm"></i>
                    </span>
                    <input type="password" id="login-password" name="password" placeholder="Password" required
                        class="login-input text-sm md:text-base">
                    <button type="button" class="toggle-password" data-target="login-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- remember + forgot -->
                <div class="flex items-center justify-between text-xs md:text-sm">
                    <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer text-[#2E1F1A] dark:text-cream">
                        <input type="checkbox"
                            class="rounded border-gray-300 dark:border-gray-600 text-terracotta focus:ring-terracotta/30 dark:bg-gray-700"
                            checked>
                        <span class="ml-1 rtl:mr-1">Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink"
                        class="text-[#2E1F1A] dark:text-cream hover:text-terracotta font-medium transition hover:underline">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="scoop-btn mt-3">
                    Sign In <i class="fas fa-sign-in-alt ml-2"></i>
                </button>

                <!-- divider -->
                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-cream dark:border-gray-700"></div>
                    </div>
                    <div class="relative justify-center flex text-xs">
                        <span class="bg-white dark:bg-[#3D2C25] px-4 py-0.5 text-[#2E1F1A] dark:text-cream rounded-full">
                            or continue with
                        </span>
                    </div>
                </div>

            </form>

            <!-- ===== SOCIAL LOGIN BUTTONS ===== -->
            <div class="mt-6">
                <div class="grid grid-cols-2 gap-3">
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('google')">
                        <i class="fab fa-google text-base"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('apple')">
                        <i class="fab fa-apple text-base"></i>
                        <span>Apple</span>
                    </button>
                </div>
            </div>

            <!-- ===== "NOT A MEMBER? SIGN UP" LINK ===== -->
            <div class="text-center mt-6 pt-4 border-t border-dashed border-cream dark:border-gray-700/40">
                <p class="text-sm md:text-base font-semibold text-[#2E1F1A] dark:text-cream">
                    New to PatioNest?
                    <a href="signup.html" class="text-terracotta dark:text-terracotta hover:text-dusk font-bold transition ml-1 rtl:mr-1 hover:underline">Sign Up</a>
                </p>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        (function() {
            // ---------- THEME TOGGLE ----------
            const themeToggle = document.getElementById('theme-toggle');

            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }

                const icon = themeToggle?.querySelector('i');
                if (icon) {
                    icon.classList.remove('fa-sun', 'fa-moon');
                    icon.classList.add(isDark ? 'fa-moon' : 'fa-sun');
                }

                if (isDark) {
                    themeToggle?.classList.add('active');
                    localStorage.setItem('theme', 'dark');
                } else {
                    themeToggle?.classList.remove('active');
                    localStorage.setItem('theme', 'light');
                }
            }

            // Check for saved theme or system preference
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                setTheme(true);
            } else if (savedTheme === 'light') {
                setTheme(false);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme(true);
            } else {
                setTheme(false);
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            // ---------- RTL TOGGLE ----------
            const rtlBtn = document.getElementById('rtl-toggle');

            function setRTL(isRTL) {
                if (isRTL) {
                    document.documentElement.dir = 'rtl';
                    document.documentElement.lang = 'ar';
                    rtlBtn?.classList.add('active');
                    localStorage.setItem('dir', 'rtl');
                } else {
                    document.documentElement.dir = 'ltr';
                    document.documentElement.lang = 'en';
                    rtlBtn?.classList.remove('active');
                    localStorage.setItem('dir', 'ltr');
                }
            }
            const savedDir = localStorage.getItem('dir');
            savedDir === 'rtl' ? setRTL(true) : setRTL(false);

            if (rtlBtn) {
                rtlBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    setRTL(document.documentElement.dir !== 'rtl');
                });
            }

            // ---------- EYE ICON TOGGLE PASSWORD VISIBILITY ----------
            const toggleButtons = document.querySelectorAll('.toggle-password');
            toggleButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const passwordInput = document.getElementById(targetId);
                    if (passwordInput) {
                        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                        passwordInput.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            if (type === 'text') {
                                icon.classList.remove('fa-eye-slash');
                                icon.classList.add('fa-eye');
                            } else {
                                icon.classList.remove('fa-eye');
                                icon.classList.add('fa-eye-slash');
                            }
                        }
                    }
                });
            });

            // ---------- FORGOT PASSWORD HANDLER ----------
            const forgotLink = document.getElementById('forgotPasswordLink');
            if (forgotLink) {
                forgotLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('🌿 A password reset link will be sent to your email. Check your inbox!');
                });
            }

            // ---------- LOGIN FORM HANDLER ----------
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const email = document.getElementById('login-email')?.value;
                    const password = document.getElementById('login-password')?.value;

                    if (!email || !password) {
                        alert('Please enter both email and password');
                        return;
                    }

                    // Direct redirect to index.html
                    window.location.href = 'index.html';
                });
            }

            // ---------- SOCIAL LOGIN HANDLER ----------
            window.socialLogin = function(provider) {
                alert(`🌿 ${provider.charAt(0).toUpperCase() + provider.slice(1)} login would be implemented here.\n\n✨ Welcome to the PatioNest community!`);
            };

            // ---------- SIGN UP LINK ----------
            // Normal link behavior preserved
        })();
    </script>
</body>
</html>
